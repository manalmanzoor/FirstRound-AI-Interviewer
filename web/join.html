<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>FirstRound -- Interview</title>
<script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
<style>
  body {
    background: #0b0c10;
    color: #eaeaea;
    font-family: system-ui, sans-serif;
    padding: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  .controls { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  input { width: 480px; padding: 6px; margin: 4px 0; background:#1a1c22; color:#eaeaea; border:1px solid #333; }
  button { padding: 8px 16px; }
  canvas { background: #14161c; border-radius: 16px; }
  #log { white-space: pre-wrap; background:#14161c; padding:12px; border-radius:8px; margin-top:8px; font-size: 12px; max-height: 220px; overflow-y: auto; width: 600px; }
</style>
</head>
<body>
  <h2>FirstRound -- Live Interview</h2>

  <canvas id="face" width="320" height="320"></canvas>

  <div class="controls">
    <input id="url" placeholder="wss://your-project.livekit.cloud" />
    <input id="token" placeholder="paste token from scripts/mint_lean_room.py" />
    <button id="connectBtn">Connect</button>
  </div>

  <div id="log"></div>
  <audio id="remoteAudio" autoplay></audio>

<script>
const params = new URLSearchParams(window.location.search);
if (params.get("url")) document.getElementById("url").value = params.get("url");
if (params.get("token")) document.getElementById("token").value = params.get("token");

const logEl = document.getElementById("log");
function log(msg) {
  const t = new Date().toISOString().split("T")[1].split("Z")[0];
  logEl.textContent += `[${t}] ${msg}\n`;
  logEl.scrollTop = logEl.scrollHeight;
}

// --- Avatar: same amplitude-driven lip-sync technique proven standalone
// in web/avatar.html (Phase 4), hooked here to the LIVE remote track
// instead of a local file. ---
const canvas = document.getElementById("face");
const ctx = canvas.getContext("2d");
let analyser, dataArray;
let mouthOpenness = 0;

function drawFace(openness) {
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);

  ctx.fillStyle = "#f2c9a0";
  ctx.beginPath();
  ctx.ellipse(w / 2, h / 2, 105, 125, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#22252c";
  ctx.beginPath();
  ctx.ellipse(w / 2 - 40, h / 2 - 27, 9, 12, 0, 0, Math.PI * 2);
  ctx.ellipse(w / 2 + 40, h / 2 - 27, 9, 12, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = "#5a4632";
  ctx.lineWidth = 5;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(w / 2 - 55, h / 2 - 49);
  ctx.lineTo(w / 2 - 22, h / 2 - 53);
  ctx.moveTo(w / 2 + 22, h / 2 - 53);
  ctx.lineTo(w / 2 + 55, h / 2 - 49);
  ctx.stroke();

  const mouthW = 62;
  const mouthH = 5 + openness * 48;
  ctx.fillStyle = "#7a3b3b";
  ctx.beginPath();
  ctx.ellipse(w / 2, h / 2 + 48, mouthW / 2, mouthH / 2, 0, 0, Math.PI * 2);
  ctx.fill();

  if (openness > 0.35) {
    ctx.fillStyle = "#f5f0e6";
    ctx.beginPath();
    ctx.ellipse(w / 2, h / 2 + 48 - mouthH / 4, mouthW / 2 - 7, mouthH / 4, 0, 0, Math.PI * 2);
    ctx.fill();
  }
}

// Throttled to ~20fps rather than requestAnimationFrame's 60fps. The
// mouth is a single ellipse -- 60fps buys nothing visually, and this
// machine's CPU is the binding constraint on the whole call (the agent
// worker, WebRTC decode and a screen recorder are all competing). Redraw
// cost was contributing to the audio/turn-taking jitter reported after
// the avatar was first wired in.
const FRAME_MS = 50;
let lastFrame = 0;

function animate(now) {
  requestAnimationFrame(animate);
  if (now - lastFrame < FRAME_MS) return;
  lastFrame = now;

  if (!analyser) { drawFace(0); return; }
  analyser.getByteFrequencyData(dataArray);
  const avg = dataArray.reduce((a, b) => a + b, 0) / dataArray.length;
  const target = Math.min(1, avg / 90);
  mouthOpenness += (target - mouthOpenness) * 0.35;
  drawFace(mouthOpenness);
}
requestAnimationFrame(animate);

// Created during the Connect click (a real user gesture) -- browsers
// block/suspend an AudioContext created or resumed outside one, which is
// why the avatar animated fine standalone in avatar.html (resume() ran
// straight off the Play button) but sat frozen during a live interview,
// where the old code called resume() from an async TrackSubscribed
// callback instead.
let audioCtx = null;

function ensureAudioContext() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === "suspended") audioCtx.resume();
}

function wireAvatarToTrack(track) {
  // Analysis TAP, not a playback path. The previous version called
  // createMediaElementSource(audioEl), which reroutes the <audio>
  // element's output through the Web Audio graph -- so the agent's voice
  // stopped playing natively and instead depended on
  // analyser -> destination, adding FFT work directly into the audio
  // path. That degraded audio clarity on this CPU. Here the <audio>
  // element keeps playing exactly as it did before the avatar existed,
  // and we read a SEPARATE MediaStream source purely to drive the mouth.
  // Deliberately never connected to audioCtx.destination -- doing so
  // would double up the audio.
  try {
    ensureAudioContext();
    const stream = new MediaStream([track.mediaStreamTrack]);
    const sourceNode = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    dataArray = new Uint8Array(analyser.frequencyBinCount);
    sourceNode.connect(analyser);
    log("avatar wired to agent audio (analysis tap, playback untouched)");
  } catch (e) {
    // The interview matters more than the avatar -- never let a
    // visualization failure take down the call.
    log(`avatar wiring failed (call continues): ${e.message || e}`);
  }
}

// --- LiveKit room connection ---
const connectBtn = document.getElementById("connectBtn");
connectBtn.addEventListener("click", async () => {
  const url = document.getElementById("url").value.trim();
  const token = document.getElementById("token").value.trim();
  if (!url || !token) { log("ERROR: need both URL and token"); return; }

  // A second click reconnects with the same identity, which LiveKit
  // resolves by kicking the first session ("disconnected: 2" =
  // DUPLICATE_IDENTITY). Seen for real during Phase 7 testing.
  connectBtn.disabled = true;
  connectBtn.textContent = "Connecting...";

  // MUST happen here, inside the click handler, while we still have a
  // real user gesture -- see ensureAudioContext()'s note. Creating it
  // later (from the async TrackSubscribed callback) leaves the context
  // suspended and the avatar frozen.
  ensureAudioContext();

  const room = new LivekitClient.Room();

  room.on(LivekitClient.RoomEvent.Connected, () => log("OK connected to room"));
  room.on(LivekitClient.RoomEvent.Disconnected, (reason) => log(`disconnected: ${reason}`));
  room.on(LivekitClient.RoomEvent.ParticipantConnected, (p) => log(`participant joined: ${p.identity}`));
  room.on(LivekitClient.RoomEvent.TrackSubscribed, (track, pub, participant) => {
    log(`subscribed to ${track.kind} track from ${participant.identity}`);
    if (track.kind === "audio") {
      // Native playback path, exactly as before the avatar existed.
      track.attach(document.getElementById("remoteAudio"));
      // Separate analysis tap for the avatar's mouth.
      wireAvatarToTrack(track);
    }
  });
  room.on(LivekitClient.RoomEvent.ConnectionStateChanged, (state) => log(`connection state: ${state}`));

  const start = performance.now();
  log(`connecting to ${url} ...`);
  try {
    await room.connect(url, token);
    log(`connect() resolved in ${(performance.now() - start).toFixed(0)}ms`);
    await room.localParticipant.setMicrophoneEnabled(true);
    log("mic published -- waiting for the interviewer to speak");
    connectBtn.textContent = "Connected";
  } catch (e) {
    log(`ERROR: ${e.message || e}`);
    connectBtn.disabled = false;
    connectBtn.textContent = "Connect";
  }
});
</script>
</body>
</html>
